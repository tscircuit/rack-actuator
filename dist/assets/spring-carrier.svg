<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440"><defs><marker id="up" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#68dfc2"/></marker></defs><rect width="1080" height="440" rx="16" fill="#111b25"/><g font-family="Arial,sans-serif" fill="#e9f1f6"><text x="30" y="38" font-size="20">FOUR-LEAF SPRING CARTRIDGE / ONE PER LOWER BEARING</text><text x="30" y="68" font-size="15" fill="#9badbb">Side schematic · second pair lies on the far side of the axle · deflection exaggerated</text></g><rect x="100" y="120" width="75" height="230" rx="10" fill="#526576"/><rect x="600" y="120" width="75" height="230" rx="10" fill="#db8a54"/><path d="M175 145C320 145 440 160 600 160M175 320C320 320 440 335 600 335" stroke="#db8a54" stroke-width="9" fill="none"/><path d="M195 120C340 120 460 135 620 135M195 295C340 295 460 310 620 310" stroke="#db8a54" stroke-width="7" opacity=".4" fill="none"/><rect x="328" y="178" width="80" height="124" rx="6" fill="#b9c8d4"/><path d="M140 232H625" stroke="#17232f" stroke-width="20"/><path d="M140 232H625" stroke="#a5b6c3" stroke-width="10"/><path d="M368 162V114" stroke="#68dfc2" stroke-width="4" marker-end="url(#up)"/><path d="M580 365H690" stroke="#526576" stroke-width="9"/><path d="M136 350V380" stroke="#a5b6c3" stroke-width="8"/><g font-family="Arial,sans-serif" fill="#e9f1f6"><text x="725" y="135" font-size="18">Automatic upward contact</text><text x="725" y="165" font-size="15" fill="#9badbb">0.30 mm nominal leaf deflection</text><text x="725" y="225" font-size="18">Axle block stays upright</text><text x="725" y="255" font-size="15" fill="#9badbb">Two leaves on each side</text><text x="725" y="285" font-size="15" fill="#9badbb">Rounded 0.8 mm root transitions</text><text x="725" y="345" font-size="15" fill="#9badbb">Two ordinary bolts hold each root.</text><text x="725" y="372" font-size="15" fill="#9badbb">No preload locking set screw.</text><text x="30" y="415" font-size="14" fill="#9badbb">Print on the broad side face. STL is unloaded; STEP/viewer show assembled deflection. Stops limit downward flexure to 0.8 mm.</text></g></svg>
